[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "v0-1-0-beta"
version = "0.1.0"
description = "NOVUM Fresh-line - a next-generation modular Discord Bot."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.2",
]

[tool.setuptools]
packages = ["core", "cogs"]
